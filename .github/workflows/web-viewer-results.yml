name: Export LAN Web Viewer device results
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate recorded report format
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('docs/test-results/1.1.1')
          report = json.loads((root / 'report.json').read_text())
          assert report['version'] == '1.1.1'
          assert re.fullmatch('[0-9a-f]{64}', report['deb_sha256'])
          assert all(t['status'] in ('passed', 'partial', 'failed', 'not_run', 'deferred') for t in report['tests'])
          for line in (root / 'device-events.jsonl').read_text().splitlines():
              assert isinstance(json.loads(line), dict)
          print('Recorded evidence parsed; unperformed checks remain unperformed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DKViewPhone-1.1.1-LAN-Web-Viewer-results
          path: |
            docs/test-results/1.1.1/
            docs/WEB-VIEWER-RESULTS.md
            docs/LAN-WEB-VIEWER.md
          if-no-files-found: error
          retention-days: 30
